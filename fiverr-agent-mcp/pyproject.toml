[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fiverr-agent-mcp"
version = "0.1.0"
description = "Production-ready MCP server that automates an authenticated Fiverr account via Playwright browser automation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fiverr Agent MCP contributors" }]
keywords = ["mcp", "fiverr", "playwright", "automation", "agent"]

dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "playwright>=1.44.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
]

[project.scripts]
fiverr-agent-mcp = "fiverr_agent_mcp.__main__:main"
fiverr-agent-mcp-smoke = "fiverr_agent_mcp.smoke:main"
fiverr-agent-mcp-validate = "fiverr_agent_mcp.validation.live:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fiverr_agent_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
